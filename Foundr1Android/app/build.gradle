plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def foundr1VersionCode = (System.getenv("FOUNDR1_ANDROID_VERSION_CODE") ?: "1").toInteger()
def foundr1VersionName = System.getenv("FOUNDR1_ANDROID_VERSION_NAME") ?: "0.1.0"
def releaseSigningPropertiesFile = System.getenv("FOUNDR1_ANDROID_SIGNING_PROPERTIES")
    ? file(System.getenv("FOUNDR1_ANDROID_SIGNING_PROPERTIES"))
    : file("${System.getProperty("user.home")}/.foundr1/android/release.properties")
def releaseSigningProperties = new Properties()
def hasReleaseSigning = releaseSigningPropertiesFile.exists()
if (hasReleaseSigning) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}
def releaseBuildRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
if (releaseBuildRequested && !hasReleaseSigning) {
    throw new GradleException("Release signing properties not found: ${releaseSigningPropertiesFile}")
}

android {
    namespace "jp.foundr1.store"
    compileSdk 35

    defaultConfig {
        minSdk 26
        targetSdk 35
        versionCode foundr1VersionCode
        versionName foundr1VersionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigningProperties.getProperty("storeFile"))
                storePassword releaseSigningProperties.getProperty("storePassword")
                keyAlias releaseSigningProperties.getProperty("keyAlias")
                keyPassword releaseSigningProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    flavorDimensions "surface"

    productFlavors {
        store {
            dimension "surface"
            applicationId "jp.foundr1.store"
        }
        os {
            dimension "surface"
            applicationId "jp.foundr1.os"
        }
        member {
            dimension "surface"
            applicationId "jp.foundr1.member"
        }
        staff {
            dimension "surface"
            applicationId "jp.foundr1.staff"
        }
        bridge {
            dimension "surface"
            applicationId "jp.foundr1.bridge"
        }
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testStoreImplementation "junit:junit:4.13.2"
    testStoreImplementation "org.robolectric:robolectric:4.14.1"
    storeImplementation "com.google.firebase:firebase-messaging:24.1.2"
    storeImplementation "com.google.android.gms:play-services-location:21.3.0"
    storeImplementation "androidx.work:work-runtime:2.9.1"
    storeImplementation "androidx.webkit:webkit:1.12.1"
    implementation "com.pusher:pusher-java-client:2.4.4"
    implementation "com.starmicronics:stario10:1.12.1"
    implementation "com.google.zxing:core:3.5.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.8.1"
}
